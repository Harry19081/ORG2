name: Claude history canary

# Proves the automatic Claude history handoff against the newest Claude Code CLI and Claude Desktop
# releases before users auto-update to them. Runs the offline handoff fixtures
# with the real CLI in disposable homes against a loopback model endpoint; nothing
# here needs an Anthropic account. A failure opens (or updates) one issue per release.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: claude-history-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run the canary against the newest Claude releases
        id: canary
        run: |
          python3 scripts/ci/claude-history-canary.py --summary claude-history-canary.json
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-history-canary
          path: claude-history-canary.json
          if-no-files-found: ignore
      - name: Open or update the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          summary=claude-history-canary.json
          version=$(python3 -c "import json;d=json.load(open('$summary'));print('cli '+str(d.get('cli',{}).get('version') or d.get('cli',{}).get('banner') or '?')+' / desktop '+str(d.get('desktop',{}).get('version') or '?'))")
          title="Claude history canary failed for Claude release ${version}"
          body_file=$(mktemp)
          {
            echo "The automatic Claude history handoff failed its offline fixtures against the newest Claude Code CLI and Claude Desktop release."
            echo
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Release: ${version}"
            echo
            echo '```json'
            python3 -c "import json;d=json.load(open('$summary'));[s.pop('tail',None) for s in d.get('fixtures',[])];print(json.dumps(d,indent=2))"
            echo '```'
            echo
            echo "Failing fixture output:"
            python3 -c "import json;d=json.load(open('$summary'));print('\n'.join('### '+s['fixture']+'\n```\n'+s['tail']+'\n```' for s in d.get('fixtures',[]) if not s['passed']))"
          } > "$body_file"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body_file"
          else
            gh issue create --title "$title" --label "claude-history" --body-file "$body_file" || gh issue create --title "$title" --body-file "$body_file"
          fi
