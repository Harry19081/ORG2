name: Codex history canary

# Proves the automatic Codex history handoff against the newest Codex Desktop
# release before users auto-update to it. Runs the native probe scenarios in
# disposable homes with a loopback model endpoint; nothing here needs an
# OpenAI account. A failure opens (or updates) one issue per release.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: codex-history-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Run the canary against the appcast release
        id: canary
        run: |
          python3 scripts/ci/codex-history-canary.py --summary codex-history-canary.json
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-history-canary
          path: codex-history-canary.json
          if-no-files-found: ignore
      - name: Open or update the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          summary=codex-history-canary.json
          version=$(python3 -c "import json;d=json.load(open('$summary'));print(d.get('release',{}).get('version') or d.get('cliVersion') or 'unknown')")
          title="Codex history canary failed for Codex Desktop ${version}"
          body_file=$(mktemp)
          {
            echo "The automatic Codex history handoff failed its native probe against the newest Codex Desktop release."
            echo
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Release: ${version}"
            echo
            echo '```json'
            python3 -c "import json;d=json.load(open('$summary'));[s.pop('tail',None) for s in d.get('scenarios',[])];print(json.dumps(d,indent=2))"
            echo '```'
            echo
            echo "Failing scenario output:"
            python3 -c "import json;d=json.load(open('$summary'));print('\n'.join('### '+s['scenario']+'\n```\n'+s['tail']+'\n```' for s in d.get('scenarios',[]) if not s['passed']))"
          } > "$body_file"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body_file"
          else
            gh issue create --title "$title" --label "codex-history" --body-file "$body_file" || gh issue create --title "$title" --body-file "$body_file"
          fi
